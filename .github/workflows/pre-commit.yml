# Mirrors .pre-commit-config.yaml in CI so local hooks and CI can never drift:
# both run the identical config at the identical pinned revs.
name: pre-commit
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install pre-commit==4.3.0
      - run: pre-commit run --all-files --show-diff-on-failure
