<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps Monitor</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{
  /* minimal shadcn/ui — neutral zinc palette, brand red reserved as a sparing accent */
  --bg:#FAFAFA; --card:#FFFFFF; --muted:#F4F4F5;
  --border:#E4E4E7; --border-strong:#D4D4D8;
  --text:#18181B; --text-muted:#52525B; --text-faint:#A1A1AA;
  --primary:#18181B; --primary-fg:#FAFAFA;
  --brand:#FF3621; --brand-dark:#18181B; --brand-soft:#F4F4F5;
  --ok:#16A34A; --ok-bg:#F0FDF4;
  --warn:#CA8A04; --warn-bg:#FEFCE8;
  --crit:#DC2626; --crit-bg:#FEF2F2;
  --info:#2563EB; --info-bg:#EFF6FF;
  --purple:#7C3AED; --purple-bg:#F5F3FF; --teal:#0D9488;
  --grid:#F4F4F5;
  --shadow:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-md:0 4px 12px -2px rgba(0,0,0,.08);
  --radius:8px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
a{color:var(--info);text-decoration:none}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.logo{width:24px;height:24px;border-radius:6px;cursor:pointer;display:block}
header h1{font-size:16px;font-weight:600;cursor:pointer}
header .sub{color:var(--text-muted);font-size:12px}
header .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted)}
button.action{background:var(--card);border:1px solid var(--border-strong);border-radius:8px;padding:6px 12px;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer}
button.action:hover{border-color:var(--border-strong);background:var(--muted)}
main{padding:18px 24px 60px}
main.home{max-width:1280px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.kpi .label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}
.kpi .value{font-size:26px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .unit{font-size:13px;color:var(--text-muted);font-weight:500}
.kpi .hint{font-size:11.5px;color:var(--text-faint);margin-top:2px}
.kpi.na .value{color:var(--text-faint)}
section h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:18px 0 10px}
.attention{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:6px}
.attention .row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--grid);cursor:pointer}
.attention .row:last-child{border-bottom:none}
.attention .why{color:var(--text-muted);font-size:12.5px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(335px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;cursor:pointer;transition:border-color .12s;display:flex;flex-direction:column}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.card .top{display:flex;align-items:center;gap:8px}
.card .name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .desc2{font-size:12px;color:var(--text-muted);line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:35px}
.card .statrow{display:grid;grid-template-columns:1fr 1.5fr .8fr 1fr;gap:6px;border-top:1px solid var(--grid);margin-top:10px;padding-top:10px}
.card .cs{min-width:0;overflow:hidden}
.card .cs .v{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
.card .cs .v .u{font-size:11px;font-weight:500;color:var(--text-muted)}
.card .cs .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-top:1px}
.card .cardfoot{display:flex;align-items:center;gap:8px;margin-top:auto;border-top:1px solid var(--grid);padding-top:10px;min-height:34px}
.card .techline{font-size:11px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .sigs{margin-left:auto;display:flex;gap:6px;flex:none}
.card .aspects{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tchip{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--info-bg);color:var(--info)}
.cxline{font-size:11px;color:var(--text-faint);margin-left:auto;font-variant-numeric:tabular-nums}
.srcnote{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--text-faint);text-transform:uppercase;vertical-align:1px;margin-left:2px}
.nba{font-size:11px;font-weight:600;border:1px solid var(--border-strong);background:var(--card);border-radius:6px;padding:3px 9px;cursor:pointer;color:var(--text);white-space:nowrap}
.nba:hover{border-color:var(--brand);color:var(--brand-dark)}
.takeaways{display:grid;gap:6px;margin:0 0 16px}
.tk{display:flex;align-items:baseline;gap:9px;font-size:13.5px;font-weight:550;cursor:pointer;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);line-height:1.45}
.tk:hover{background:var(--card);border-color:var(--border-strong)}
.tk .sev-ic{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.tk.bad .sev-ic{background:var(--crit)}.tk.warn .sev-ic{background:var(--warn)}.tk.good .sev-ic{background:var(--ok)}
.tk .go{margin-left:auto;font-size:11px;color:var(--info);font-weight:600;white-space:nowrap}
.pill{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.degraded{background:var(--warn-bg);color:var(--warn)}
.pill.down{background:var(--crit-bg);color:var(--crit)}
.pill.stopped{background:var(--grid);color:var(--text-muted)}
.pill.pending{background:var(--info-bg);color:var(--info)}
.spark{margin:10px 0 2px;display:block;width:100%;height:auto}
.meta{display:flex;gap:12px;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.meta b{color:var(--text);font-weight:600}
.badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--grid);color:var(--text-muted);cursor:pointer}
.badge:hover{outline:1px solid var(--border-strong);filter:brightness(.96)}
.stat[data-nav]{cursor:pointer} .stat[data-nav]:hover .l{color:var(--brand-dark)}
.badge.money{background:var(--info-bg);color:var(--info)}
.badge.good{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--crit-bg);color:var(--crit)}
.empty{background:var(--card);border:1px dashed var(--border-strong);border-radius:var(--radius);padding:40px;text-align:center;color:var(--text-muted)}
.footerline{margin-top:26px;font-size:11.5px;color:var(--text-faint)}
/* ---- app detail: rail + canvas ---- */
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.rail{position:sticky;top:62px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;max-height:calc(100vh - 80px);overflow-y:auto}
.rail .back{display:block;font-size:12.5px;font-weight:600;color:var(--info);padding:8px 10px;border-bottom:1px solid var(--grid);margin-bottom:4px;cursor:pointer}
.railitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.railitem:hover{background:var(--bg)}
.railitem.cur{background:var(--brand-soft);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.railitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.railitem .ms{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.apphead{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px}
.apphead .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.apphead h2{font-size:19px;font-weight:650;margin:0;text-transform:none;letter-spacing:0}
.apphead .desc{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.stats{display:flex;gap:0;margin-top:12px;border-top:1px solid var(--grid);padding-top:10px;flex-wrap:wrap}
.stat{padding:0 18px;border-right:1px solid var(--grid);min-width:90px}
.stat:first-child{padding-left:0}.stat:last-child{border-right:none}
.stat .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-height:26px;line-height:1.2}
.stat .l{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-top:1px}
.tabs{margin:0 0 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 12px 0}
.grouprow{display:flex;gap:4px;align-items:center}
.gtab{border:none;background:none;font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--text-muted);padding:8px 12px;cursor:pointer;border-radius:8px 8px 0 0}
.gtab.active{color:var(--brand-dark)}
.gtab:hover{color:var(--text)}
.subrow{display:flex;flex-wrap:wrap;gap:2px;border-top:1px solid var(--grid);padding:2px 2px 0}
.tab{border:none;background:none;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--text-muted);padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--brand-dark);border-bottom-color:var(--brand)}
.tabs select{margin-left:auto;border:1px solid var(--border-strong);border-radius:6px;padding:3px 6px;font-size:12px;color:var(--text);background:var(--card)}
.ovgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:4px}
@media (min-width:1500px){.ovgrid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:760px){.ovgrid{grid-template-columns:1fr}}
.ovcard{border:1px solid var(--grid);border-radius:10px;padding:14px 16px}
.ovcard h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:0 0 8px;display:flex;align-items:center;gap:7px}
.ovcard .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ovcard .rows{margin-top:8px;font-size:12.5px;color:var(--text-muted);display:grid;gap:4px}
.ovcard .rows b{color:var(--text)}
.ovlink{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:var(--info);cursor:pointer}
.ovdot{width:9px;height:9px;border-radius:50%;flex:none}
#tabBody{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;min-height:300px}
.errbox{background:var(--crit-bg);color:var(--crit);border-radius:8px;padding:12px;font-size:12.5px;word-break:break-word}
.loading{color:var(--text-faint);padding:18px;font-size:12.5px}
table.data{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.data th{text-align:left;color:var(--text-muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.data td{padding:5px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;vertical-align:top}
table.data td.mono{font-family:var(--mono);font-size:11px;word-break:break-all}
table.data tr.click{cursor:pointer} table.data tr.click:hover{background:var(--bg)}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px}
.chip.ERROR,.chip.CRITICAL,.chip.FATAL{background:var(--crit-bg);color:var(--crit)}
.chip.WARN,.chip.WARNING{background:var(--warn-bg);color:var(--warn)}
.chip.INFO,.chip.DEBUG,.chip.UNKNOWN{background:var(--info-bg);color:var(--info)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-muted);margin:4px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.rail{position:static;display:flex;overflow-x:auto;max-height:none}.rail .back{border:none}}
.chartbox{border:1px solid var(--grid);border-radius:8px;padding:10px;margin-top:8px}
.chartbox .cap{font-size:11.5px;color:var(--text-muted);margin-bottom:6px}
.chartbox svg{width:100%;height:auto}
.wf{font-size:11.5px;margin-top:10px}
.wf .row{display:grid;grid-template-columns:minmax(240px,320px) 1fr 76px;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--grid)}
.wf .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:10.5px}
.wf .track{position:relative;height:12px;background:var(--grid);border-radius:3px}
.wf .bar{position:absolute;top:0;height:12px;border-radius:3px;background:var(--info)}
.back{border:none;background:none;color:var(--info);font-size:12.5px;cursor:pointer;padding:0;margin-bottom:8px}
.tabinfo{font-size:12px;color:var(--text-muted);line-height:1.5;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--grid)}
input,select{border:1px solid var(--border-strong);border-radius:6px;padding:6px 9px;font-family:var(--font);
  font-size:12.5px;color:var(--text);background:var(--card)}
input:focus,select:focus{outline:none;border-color:var(--info)}
table.data td input{width:100%;max-width:280px}
.sec{margin:0 0 20px}
.sec .cap{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:6px}
.btnrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
#tip{position:fixed;display:none;z-index:40;background:var(--text);color:#fff;font-size:11.5px;line-height:1.55;
  padding:8px 11px;border-radius:8px;max-width:340px;box-shadow:0 6px 20px rgba(16,24,40,.25);pointer-events:none}
.actionbar{display:flex;align-items:center;gap:10px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.actionbar .ab-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-right:4px}
.govpanel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px;max-width:720px}
.appactions{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.appactions .ab-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint)}
#tip b{color:#fff} #tip .dim{color:#B9C4CC} #tip .sep{border-top:1px solid rgba(255,255,255,.18);margin:5px 0}
/* ---- dashboard segmented control (shadcn tabs/toggle-group) ---- */
.dashhead{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.dashhead h1{font-size:20px;font-weight:650;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--muted);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;font-family:var(--font);font-size:13px;font-weight:500;color:var(--text-muted);padding:6px 15px;border-radius:6px;cursor:pointer;transition:background .1s}
.seg button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button:hover:not(.active){color:var(--text)}
.dashhead .spacer{flex:1}
/* ---- catalog (faceted table) ---- */
.catlayout{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start}
.facets{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:sticky;top:74px}
.facets h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:14px 0 6px}
.facets h4:first-child{margin-top:0}
.facets label{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 0;cursor:pointer}
.facets .ct{margin-left:auto;color:var(--text-faint);font-variant-numeric:tabular-nums}
.catwrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table.cat{width:100%;border-collapse:collapse;font-size:12.5px}
table.cat th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-muted);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
table.cat th:hover{color:var(--text)} table.cat th.sorted{color:var(--text)}
table.cat td{padding:9px 12px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
table.cat tr.click{cursor:pointer} table.cat tr.click:hover{background:var(--muted)}
.catsearch{border:1px solid var(--border-strong);border-radius:8px;padding:7px 11px;font-size:13px;min-width:240px}
.dotv{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0}
/* ---- topology ---- */
#topo{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
#topo text{font-family:var(--font)}
.topolegend{display:flex;gap:16px;font-size:11.5px;color:var(--text-muted);margin-bottom:10px}
.topolegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* ---- inspect (single app, no rail) ---- */
main.inspect{max-width:1440px;margin:0 auto}
.backbar{margin-bottom:12px}
.backbar a{font-size:12.5px;font-weight:500;color:var(--text-muted);cursor:pointer}
.backbar a:hover{color:var(--text)}
</style>
</head>
<body>
<header>
  <img class="logo" src="icon.svg" alt="Apps Monitor" onclick="location.hash=''">
  <div onclick="location.hash=''"><h1>Apps Monitor</h1><div class="sub">Fleet health, cost, usage & code risk for Databricks Apps</div></div>
  <div class="right">
    <select id="wsel" title="Workspace" style="display:none;border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--text);background:var(--card)"></select>
    <span id="refreshed">loading…</span>
    <!-- S13 -->
    <button class="action" onclick="location.href='/status'">Status</button>
    <!-- S12 -->
    <button class="action" id="federation" style="display:none" onclick="location.hash='#/federation'">Workspaces</button>
    <button class="action" onclick="location.hash='#/ask'" title="Ask about the fleet in plain language">🧞 Ask</button>
    <button class="action" id="bell" onclick="location.hash='#/alerts'" title="Alerts">🔔 <span id="bellCount"></span></button>
    <button class="action" id="sync" title="Runs the inventory job: snapshots the fleet and grants the monitor probe access">Refresh inventory</button>
  </div>
</header>
<main id="view"></main>
<script>
const $=s=>document.querySelector(s);
const SLABEL={ok:'Healthy',degraded:'Degraded',down:'Unreachable',stopped:'Stopped',pending:'Starting'};
const sl=s=>SLABEL[s]||s;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=0)=>v==null||v===''?'–':Number(v).toLocaleString('en-US',{maximumFractionDigits:d});
const ago=ts=>{if(!ts)return'–';const s=Math.max(0,Date.now()/1000-ts);return s<90?`${s|0}s ago`:s<5400?`${Math.round(s/60)}m ago`:`${Math.round(s/3600)}h ago`};
async function get(u){const r=await fetch(u);if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}return r.json()}

let DATA=null,ENRICH={security:{},reviews:{},cost:{},config:{},mtd:{},perf:{},usage:{},real_fleet:null},ALERTS=null,CUR=null,TAB='overview';
let SEG='overview';                       // dashboard segment: overview | catalog | topology | governance
const SEGS=[['overview','Overview'],['catalog','Apps'],['topology','Topology'],['alerts','Alerts'],['governance','Governance']];

// ---------------------------------------------------------------- routing
const TAB_ALIAS={probes:'operate',uptime:'operate',ops:'operate',synthetics:'operate',
  agent:'traces',security:'quality',review:'quality',analytics:'adoption',playwright:'uitests'};
function route(){
  const h=location.hash;
  let m=h.match(/^#\/app\/([^/]+)(?:\/([a-z]+))?/);

function kpi(label,value,unit,hint,cls=''){return `<div class="kpi ${cls}"><div class="label">${label}</div><div class="value">${value}<span class="unit"> ${unit||''}</span></div><div class="hint">${hint||''}</div></div>`}
function sparkline(spark,W=280,H=44){
  if(!spark||spark.length<3)return `<svg class="spark" viewBox="0 0 ${W} ${H}"><line x1="0" y1="${H-4}" x2="${W}" y2="${H-4}" stroke="var(--grid)" stroke-width="1"/><text x="2" y="${H-10}" font-size="9.5" fill="var(--text-faint)">collecting probe history…</text></svg>`;
  const lat=spark.map(p=>p[1]),max=Math.max(...lat,1)*1.18;
  const step=W/(spark.length-1);
  const y=v=>H-4-(v/max)*(H-10);
  const pts=spark.map((p,i)=>`${(i*step).toFixed(1)},${y(p[1]).toFixed(1)}`);
  const line=pts.join(' ');
  const area=`0,${H-3} ${line} ${W},${H-3}`;
  const fails=spark.map((p,i)=>p[0]?'':`<circle cx="${(i*step).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="2.6" fill="var(--crit)" stroke="var(--card)" stroke-width="1"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-label="probe latency, last ${spark.length} checks">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--info)" stop-opacity=".16"/><stop offset="1" stop-color="var(--info)" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#sg)"/>
    <line x1="0" y1="${H-3}" x2="${W}" y2="${H-3}" stroke="var(--grid)" stroke-width="1"/>
    <polyline points="${line}" fill="none" stroke="var(--info)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${fails}</svg>`;
}

function topoDeps(a){
  const out=[];(a.resources||[]).forEach(r=>{const type=Object.keys(r).find(k=>k!=='name'&&r[k]&&typeof r[k]==='object');if(!type||!TRES[type])return;
    const t=r[type];const target=t.name||t.securable_full_name||t.instance_name||('id '+(t.id||t.job_id||t.experiment_id||''))||TRES[type][0];
    out.push({key:TRES[type][0]+':'+target,label:target,icon:TRES[type][1]});});return out;
}
function drawTopology(){
  const host=$('#topo');if(!host||!DATA)return;
  const apps=DATA.apps;const depsByApp={},peers={},pmeta={};
  apps.forEach(a=>{const m={};topoDeps(a).forEach(d=>{m[d.key]=d;peers[d.key]=(peers[d.key]||0)+1;pmeta[d.key]=d;});depsByApp[a.name]=m;});
  const peerList=Object.keys(peers).sort((x,y)=>peers[y]-peers[x]);
  const W=Math.max(760,host.clientWidth||900),rowH=44,H=Math.max(apps.length,peerList.length)*rowH+40;
  const ax=Math.max(150,W*0.26),px=W*0.72;
  const ay=i=>28+i*(H-56)/Math.max(apps.length-1,1),py=i=>28+i*(H-56)/Math.max(peerList.length-1,1);
  const pos={},ppos={};apps.forEach((a,i)=>pos[a.name]={x:ax,y:ay(i)});peerList.forEach((p,i)=>ppos[p]={x:px,y:py(i)});
  let edges='';apps.forEach(a=>{const s=pos[a.name];Object.keys(depsByApp[a.name]).forEach(k=>{const d=ppos[k];
    edges+=`<path d="M${s.x} ${s.y} C ${(s.x+d.x)/2} ${s.y}, ${(s.x+d.x)/2} ${d.y}, ${d.x} ${d.y}" fill="none" stroke="var(--border-strong)" stroke-width="1.2" data-app="${esc(a.name)}"/>`;});});
  let nodes='';
  peerList.forEach(p=>{const d=ppos[p],shared=peers[p]>1,m=pmeta[p];
    nodes+=`<g><rect x="${d.x-5}" y="${d.y-5}" width="10" height="10" rx="2.5" fill="${shared?'var(--text-muted)':'var(--border-strong)'}"/>
      <text x="${d.x+12}" y="${d.y+3.5}" font-size="11" fill="var(--text-muted)">${esc(m.icon)} ${esc(m.label)}${shared?`  ·${peers[p]} apps`:''}</text></g>`;});
  apps.forEach(a=>{const s=pos[a.name];
    nodes+=`<g style="cursor:pointer" onclick="goApp('${esc(a.name)}')" onmouseenter="topoHL('${esc(a.name)}',1)" onmouseleave="topoHL('${esc(a.name)}',0)">
      <circle cx="${s.x}" cy="${s.y}" r="9" fill="${statusColor(a.status)}"/>${alertCount(a.name)?`<circle cx="${s.x+8}" cy="${s.y-8}" r="4" fill="var(--crit)" stroke="var(--card)" stroke-width="1.5"/>`:''}
      <text x="${s.x-15}" y="${s.y+3.5}" text-anchor="end" font-size="11.5" fill="var(--text)" font-weight="500">${esc(a.name)}</text></g>`;});
  const shared=peerList.filter(p=>peers[p]>1).length;
  host.innerHTML=`<svg width="${W}" height="${H}" style="width:100%">${edges}${nodes}</svg>
    <div style="padding:8px 14px;font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--grid)">${apps.length} apps · ${peerList.length} declared dependencies · ${shared} shared (blast radius) — hover an app to trace its edges, click to inspect</div>`;
}
window.topoHL=(app,on)=>{document.querySelectorAll('#topo path').forEach(p=>{
  if(p.dataset.app===app){p.setAttribute('stroke',on?'var(--brand)':'var(--border-strong)');p.setAttribute('stroke-width',on?'2':'1.2');}
  else p.setAttribute('stroke-opacity',on?'0.2':'1');});};

function appOf(name){return DATA?DATA.apps.find(x=>x.name===name):null}
function stat(v,l,tip,tab){
  const click=tab?(tab==='alerts'?`data-nav onclick="location.hash='#/alerts'"`:`data-nav onclick="goApp(CUR,'${tab}')"`):'';
  return `<div class="stat" ${click} ${tip?`data-tip="${esc(tip)}"`:''}><div class="v">${v}</div><div class="l">${l}</div></div>`}
function headStats(a){
  const n=alertCount(a.name);
  return `
    ${stat(`<span class="pill ${a.status}" style="margin:0;font-size:12px">${sl(a.status)}</span>`,'status','','operate')}
    ${stat(fmt(a.uptime_24h,1)+'%','reachable 24h','','operate')}
    ${(()=>{const p=ENRICH.perf[a.name];return p&&p.real_p95_ms!=null
      ?stat(fmt(p.real_p95_ms)+' ms','p95 · real traffic',`<b>Real-traffic latency</b><br>p95 of ${fmt(p.requests_24h)} actual requests (server spans, probes excluded) — what users experience`,'requests')
      :stat('–','p95 · real traffic','<b>No real traffic in 24 h</b><br>only probe reachability below','requests')})()}
    ${stat(fmt(a.p95_ms)+' ms','reachability','<b>Probe round-trip</b><br>the monitor’s 60-second /healthz checks — an availability signal, not user latency','operate')}
    ${(()=>{const u=ENRICH.usage[a.name];return stat(`<span style="color:var(--purple)">${u&&+u.peak_dau?fmt(u.peak_dau):'–'}</span>`,'users 7d','<b>Adoption</b><br>peak daily users over 7 days — the audience this app serves','adoption')})()}
    ${stat(fmt(a.error_rate_1h,1)+'%','errors 1h','','errors')}
    ${stat(n?`<span style="color:var(--crit)">${n}</span>`:'0','alerts firing',n?tipAlerts(a.name):'','alerts')}`;
}

  traces:'Request waterfalls and agent runs, with correlated logs.',

  cost:'Compute cost (list-price estimate, billing lags hours), AI tokens, budget and forecast.',
  adoption:'Daily and per-user usage, from pseudonymous (hashed) identifiers.',

async function loadTab(tab){
  const body=$('#tabBody');if(!body)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
  body.innerHTML='<div class="loading">querying…</div>';
  const h=$('#tabHours')?$('#tabHours').value:24;
  const info=TAB_INFO[tab]?`<div class="tabinfo">${TAB_INFO[tab]}</div>`:'';
  const set=html=>{body.innerHTML=info+html};
  const A=n=>`api/apps/${encodeURIComponent(CUR)}`+n;
  try{
    if(tab==='overview'){
      const d=await get(A('/overview'));
      set(renderOverview(d,appOf(CUR)||{}));
      body.insertAdjacentHTML('beforeend','<!-- S2 --><div class="sec" id="sloPanel">Loading SLOs…</div><!-- S5 --><div class="sec" id="telemetryHealth">Loading data quality…</div>');
      loadSloPanel(CUR);loadTelemetryHealth(CUR);
    }else if(tab==='operate'){
      const [a,sy,d]=await Promise.all([get(A('')),get(A(`/synthetics?hours=${h}`)),get(A('/ops'))]);
      set(`<div class="sec"><div class="cap" style="font-size:13px">Availability — probes &amp; journeys</div>${renderUptime(a,sy)}</div>
           <div class="sec" style="margin-top:26px;border-top:1px solid var(--grid);padding-top:16px"><div class="cap" style="font-size:13px">Operations &amp; governance</div>${renderOps(d)}</div>`);
      body.insertAdjacentHTML('afterbegin','<!-- S1 --><div class="sec" id="mutePanel">Loading maintenance windows…</div><!-- S2 --><div class="sec" id="sloPanel">Loading SLOs…</div><!-- S5 --><div class="sec" id="telemetryHealth">Loading data quality…</div>');
      loadMutePanel(CUR);loadSloPanel(CUR);loadTelemetryHealth(CUR);
    }else if(tab==='uitests'){
      const sy=await get(A('/synthetics?hours=168'));
      set(renderUITests(sy.browser||[]));
    }else if(tab==='requests'){
      set(renderRequests(await get(A(`/requests?hours=${h}`)),h));
    }else if(tab==='errors'){
      set(renderErrors(await get(A(`/errors?hours=${h}`))));
    }else if(tab==='logs'){
      set(renderLogs((await get(A(`/logs?hours=${Math.min(h,48)}`))).logs));
    }else if(tab==='traces'){
      const [tr,ag]=await Promise.all([get(A(`/traces?hours=${Math.min(h,48)}`)),get(A('/agent-traces')).catch(()=>({experiment:null,traces:[]}))]);
      set(renderTracesCombined(tr.traces,ag));
    }else if(tab==='quality'){
      const [sec,rev]=await Promise.all([get(A('/security')),get(A('/review'))]);
      const ovv=rev.overview;
      set(`${ovv?`<div class="sec"><div class="cap" style="font-size:13px">What is this app <button class="action" style="float:right;font-size:11.5px" onclick="window.print()">Print App Review</button></div>
             <div style="font-size:13.5px;line-height:1.6;max-width:860px">${esc(ovv.purpose||'')}</div>
             ${(ovv.tech_stack||[]).length?`<div class="badges" style="margin-top:8px">${ovv.tech_stack.map(t=>`<span class="tchip">${esc(t)}</span>`).join('')}</div>`:''}
             ${(ovv.endpoints||[]).length?`<div class="mono" style="font-size:11px;margin-top:8px;color:var(--text-muted);line-height:1.7">${ovv.endpoints.map(e=>esc(e)).join('<br>')}</div>`:''}</div>`
           :`<div class="sec" style="font-size:12px;color:var(--text-faint)">App overview (purpose - tech stack - endpoints) appears with the next review run. <button class="action" style="float:right;font-size:11.5px" onclick="window.print()">Print App Review</button></div>`}
           <div class="sec" style="margin-top:20px;border-top:1px solid var(--grid);padding-top:16px"><div class="cap" style="font-size:13px">Source scan</div>${renderSecurity(sec)}</div>
           <div class="sec" style="margin-top:26px;border-top:1px solid var(--grid);padding-top:16px"><div class="cap" style="font-size:13px">Automated review (advisory)</div>${renderReview(rev.review)}</div>`);
    }else if(tab==='adoption'){
      set(renderAnalytics(await get(A('/analytics'))));

      const [usage,drift]=await Promise.all([get(A('/genai')),get(A('/drift')).catch(()=>({unavailable:true}))]);
      set(renderGenAI(usage)+renderDrift(drift));
    }else if(tab==='deps'){
      set(renderDeps((await get(A('/deps'))).deps));

function verdictColor(a,d){
  if(!a||a.status==='down'||a.status==='stopped')return 'var(--crit)';
  if(a.status==='degraded')return 'var(--warn)';
  return 'var(--ok)';
}
function renderOverview(d,a){
  const s=d.scan,r=d.review,c7=d.cost_7d,m=d.mtd,u=d.usage,f=d.forecast,cfg=d.config,j=d.synth;
  const link=(t,label)=>`<span class="ovlink" onclick="goApp(CUR,'${t}')">${label} →</span>`;
  const dot=c=>`<span class="ovdot" style="background:${c}"></span>`;
  const relColor=verdictColor(a,d);
  const qColor=s?scoreColor(+s.quality_score):'var(--text-faint)';
  const budget=cfg&&+cfg.budget_usd_month||0,mtdUsd=m?+m.mtd_usd:null;
  const budgetPct=budget&&mtdUsd!=null?100*mtdUsd/budget:null;
  const costColor=budgetPct==null?'var(--info)':budgetPct>=100?'var(--crit)':budgetPct>=70?'var(--warn)':'var(--ok)';
  // board-style ranked takeaways: the ≤3 things that matter most, worst first, each a door
  const perf=ENRICH.perf[a.name];
  const tks=[];
  if(a.status&&a.status!=='ok')tks.push(['bad','🔴',`App is <b>${sl(a.status)}</b> — probes are failing`,'operate']);
  if(r&&r.verdict==='reject')tks.push(['bad','⚖️',`Would <b>not pass production review</b> — ${r.score_overall}/10${r.summary?`: “${esc(String(r.summary).slice(0,80))}…”`:''}`,'quality']);
  if(s&&+s.findings_critical>0)tks.push(['bad','🛡',`<b>${s.findings_critical} critical</b> and ${s.findings_high} high security findings — scan ${s.quality_score}/100`,'quality']);
  else if(s&&+s.findings_high>0)tks.push(['warn','🛡',`<b>${s.findings_high} high</b> security findings — scan ${s.quality_score}/100`,'quality']);
  const nAl=alertCount(a.name);
  if(nAl)tks.push(['warn','🔔',`<b>${nAl} alert${nAl>1?'s':''} firing</b> right now`,'timeline']);
  if(budget&&mtdUsd!=null&&mtdUsd>=budget)tks.push(['bad','💸',`<b>Over budget</b> — $${fmt(mtdUsd,2)} of $${fmt(budget,0)}`,'cost']);
  if(perf&&+perf.real_p95_ms>2500)tks.push(['warn','🐢',`Slow for users — real-traffic p95 <b>${fmt(perf.real_p95_ms)} ms</b>`,'requests']);
  if(!tks.length){
    if(!s||!r)tks.push(['warn','⏳','Not fully evaluated — scan or review has not run for this deployment yet','quality']);
    else tks.push(['good','✅','All clear — reachable, reviewed and on budget','timeline']);
  }
  return `<div class="takeaways">${tks.slice(0,3).map(([cls,ic,txt,tab])=>
    `<div class="tk ${cls}" onclick="goApp(CUR,'${tab}')"><span class="sev-ic"></span><span>${ic}</span><span>${txt}</span><span class="go">see it →</span></div>`).join('')}</div>
  <div class="ovgrid">
    <div class="ovcard"><h4>${dot(relColor)}Reliability</h4>
      <div class="big">${fmt(a.uptime_24h,1)}<span style="font-size:15px;color:var(--text-muted)"> % reachable 24h</span></div>
      <div class="rows">
        <span>p95 <b>${perf&&perf.real_p95_ms!=null?fmt(perf.real_p95_ms)+' ms':'–'}</b> real · reach <b>${fmt(a.p95_ms)} ms</b> · errors 1h <b>${fmt(a.error_rate_1h,1)}%</b></span>
        <span>journey <b>${j?(j.ok?'PASS':'FAIL')+' · '+esc(j.journey):'not configured'}</b></span>
        <span>alerts firing <b style="color:${alertCount(a.name)?'var(--crit)':'inherit'}">${alertCount(a.name)}</b></span>
      </div>${link('errors','Investigate errors')} &nbsp; ${link('uptime','Uptime detail')}</div>
    <div class="ovcard"><h4>${dot(qColor)}Code quality</h4>
      <div class="big" style="color:${qColor}">${s?s.quality_score:'–'}<span style="font-size:15px;color:var(--text-muted)"> /100 scan</span></div>
      <div class="rows">
        <span>critical/high findings <b>${s?+s.findings_critical+ +s.findings_high:'–'}</b> · policy <b>${s?(s.policy_violations??'–'):'–'}</b></span>
        <span>review <b>${r?(r.verdict==='approve'?'✓':r.verdict==='reject'?'✗':'⚠')+' '+esc((r.verdict||'').replace(/_/g,' '))+' · '+(r.score_overall??'')+'/10':'–'}</b></span>
        <span>dependency freshness <b>${s&&s.freshness_score!=null?s.freshness_score+'/100':'–'}</b></span>
      </div>${link('quality','Scan & review')}</div>
    <div class="ovcard"><h4>${dot(costColor)}Cost</h4>
      <div class="big">${mtdUsd!=null?'$'+fmt(mtdUsd,2):'–'}<span style="font-size:15px;color:var(--text-muted)"> month to date</span></div>
      <div class="rows">

      </div>${link('adoption','Users & engagement')}</div>

  ${d.events.length?`<div class="sec" style="margin-top:18px"><div class="cap">Recent activity</div>
    ${d.events.map(e=>`<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--grid);font-size:12.5px;align-items:baseline">
      <span style="white-space:nowrap;color:var(--text-faint);font-variant-numeric:tabular-nums">${new Date(e.ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
      <span>${EV_ICON[e.rule]||'•'}</span><span class="pill ${e.state==='firing'?'down':'ok'}" style="margin:0">${esc((e.state||'').toUpperCase())}</span>
      <span class="mono" style="color:var(--text-muted)">${esc(e.rule)}</span><span style="flex:1">${esc(e.message)}</span></div>`).join('')}
    <span class="ovlink" onclick="goApp(CUR,'timeline')">Full timeline →</span></div>`:''}`;
}
function renderUITests(rows){
  if(!rows.length)return `<div class="empty">No browser runs recorded yet.<br>
    <span style="font-size:12px">Run the <b>monitor-synthetics-browser</b> job (paused by default — serverless lacks browser system libraries; it records best-effort results either way). Artifacts land in the <span class="mono">ui_tests</span> volume of the monitor schema.</span></div>`;
  const vol=rows.find(r=>r.artifact);
  return `${vol?`<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Artifacts (result JSON + screenshot): <span class="mono">${esc(vol.artifact.split('/').slice(0,-2).join('/'))}/…</span> — browse via Catalog Explorer → Volumes.</div>`:''}
  <table class="data"><tr><th>when</th><th>check</th><th>result</th><th>HTTP</th><th>latency</th><th>detail</th><th>artifact</th></tr>
  ${rows.map(r=>{const pass=r.ok===true||r.ok==='true';return `<tr>
    <td style="white-space:nowrap">${new Date(r.run_ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
    <td>${esc(r.journey||'browser-smoke')}</td>
    <td><span class="pill ${pass?'ok':'down'}" style="margin:0">${pass?'PASS':'FAIL'}</span></td>
    <td>${r.status_code>0?r.status_code:'–'}</td>
    <td>${r.latency_ms?fmt(r.latency_ms)+' ms':'–'}</td>
    <td class="mono" style="font-size:10.5px;white-space:normal">${esc((r.detail||'').slice(0,110))}</td>
    <td class="mono" style="font-size:10px;white-space:normal">${r.artifact?esc(r.artifact.split('ui_tests/')[1]||r.artifact):'–'}</td></tr>`;}).join('')}</table>`;
}
function renderUptime(a,sy){
  return `<div class="chartbox"><div class="cap">Probe latency · 24 h · <span style="color:var(--crit)">●</span> failed checks</div>${bigChart(a.series)}</div>

    <span>p95 <b>${fmt(a.p95_ms)} ms</b></span><span data-tip="<b>Time to first byte</b><br>headers received vs full response — the streaming SLO a total-latency p95 hides">TTFB <b>${a.ttfb_ms!=null?fmt(a.ttfb_ms)+' ms':'–'}</b></span>
    <span>last <b>${a.last?fmt(a.last.ms)+' ms (HTTP '+a.last.code+')':'–'}</b></span>
    <span>compute <b>${esc(a.compute_state||'–')}</b></span></div>
    <div class="sec" style="margin-top:22px;border-top:1px solid var(--grid);padding-top:14px"><div class="cap" style="font-size:13px">Synthetic journeys</div>${renderSynthetics(sy)}</div>`;
}
function renderTracesCombined(traces,ag){
  const agent=ag&&ag.experiment?`<div class="sec"><div class="cap" style="font-size:13px">Agent runs (MLflow)</div>${renderAgentList(ag)}</div>
    <div class="sec" style="margin-top:22px;border-top:1px solid var(--grid);padding-top:14px"><div class="cap" style="font-size:13px">HTTP request traces</div>`:'<div class="sec">';

// ------------------------------------------------------------------ charts

function bigChart(series,H=160){
  // pixel-crisp at actual container width — no viewBox stretching (thin line, small text)
  const box=$('#tabBody');
  const W=Math.max(560,Math.min(1400,(box?box.clientWidth:980)-60));
  const P=34;
  if(!series||!series.length)return `<svg width="${W}" height="${H}" style="width:${W}px;height:${H}px"></svg>`;
  const t0=series[0][0],t1=series[series.length-1][0]||t0+1;
  const lat=series.map(p=>p[3]),max=Math.max(...lat,1);
  const x=t=>P+((t-t0)/Math.max(t1-t0,1))*(W-P-8);
  const y=v=>H-18-(v/max)*(H-34);
  const pts=series.map(p=>`${x(p[0]).toFixed(1)},${y(p[3]).toFixed(1)}`).join(' ');
  const fails=series.filter(p=>!p[1]).map(p=>`<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[3]).toFixed(1)}" r="3" fill="var(--crit)"><title>HTTP ${p[2]} · ${p[3]} ms</title></circle>`).join('');
  const gridlines=[0.25,0.5,0.75,1].map(f=>{const v=max*f;return `<line x1="${P}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${P-4}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--text-faint)">${v>=1000?(v/1000).toFixed(1)+'s':v.toFixed(0)}</text>`}).join('');
  const nT=Math.min(6,series.length);
  const tmark=Array.from({length:nT},(_,i)=>t0+(t1-t0)*i/(nT-1||1)).map(t=>`<text x="${x(t)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--text-faint)">${new Date(t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</text>`).join('');
  return `<svg width="${W}" height="${H}" style="width:${W}px;height:${H}px;max-width:100%">${gridlines}<polyline points="${pts}" fill="none" stroke="var(--info)" stroke-width="1.6"/>${fails}${tmark}</svg>`;
}
function barLine(rows,W=860,H=150){
  if(!rows.length)return '<div class="loading">no requests in window</div>';
  const P=34,n=rows.length,bw=Math.max(2,(W-P-8)/n-2);
  const max=Math.max(...rows.map(r=>+r.requests),1);
  const y=v=>H-16-(v/max)*(H-30);
  const bars=rows.map((r,i)=>{const x=P+i*((W-P-8)/n);const req=+r.requests,err=+r.errors;
    return `<rect x="${x}" y="${y(req)}" width="${bw}" height="${H-16-y(req)}" rx="2" fill="var(--info)"><title>${new Date(r.ts).toLocaleTimeString()} · ${req} req · ${err} err</title></rect>`+
      (err?`<rect x="${x}" y="${y(err)}" width="${bw}" height="${H-16-y(err)}" rx="2" fill="var(--crit)"></rect>`:'');}).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><text x="${P-4}" y="${y(max)+4}" text-anchor="end" font-size="9" fill="var(--text-faint)">${max}</text>
    <line x1="${P}" x2="${W-8}" y1="${H-16}" y2="${H-16}" stroke="var(--grid)"/>${bars}</svg>`;
}
function latLines(rows,W=860,H=150){
  if(!rows.length)return '';
  const P=38,max=Math.max(...rows.map(r=>+r.p95_ms||0),1);
  const x=i=>P+i*((W-P-8)/Math.max(rows.length-1,1)),y=v=>H-16-(v/max)*(H-30);
  const line=(k,color,w)=>`<polyline fill="none" stroke="${color}" stroke-width="${w}" points="${rows.map((r,i)=>`${x(i)},${y(+r[k]||0)}`).join(' ')}"/>`;
  return `<div class="legend"><span><i style="background:var(--info)"></i>p50</span><span><i style="background:var(--brand)"></i>p95</span></div>
    <svg viewBox="0 0 ${W} ${H}"><text x="${P-4}" y="${y(max)+4}" text-anchor="end" font-size="9" fill="var(--text-faint)">${max>=1000?(max/1000).toFixed(1)+'s':max+'ms'}</text>
    <line x1="${P}" x2="${W-8}" y1="${H-16}" y2="${H-16}" stroke="var(--grid)"/>${line('p50_ms','var(--info)',1.6)}${line('p95_ms','var(--brand)',1.6)}</svg>`;
}
function dayBars(rows,key,color,fmtV,W=860,H=140){
  const vals=rows.map(r=>+r[key]||0),max=Math.max(...vals,0.0001);
  const P=46,n=rows.length,bw=Math.max(3,(W-P-8)/Math.max(n,1)-3);
  const y=v=>H-18-(v/max)*(H-32);
  return `<svg viewBox="0 0 ${W} ${H}"><text x="${P-4}" y="${y(max)+4}" text-anchor="end" font-size="9" fill="var(--text-faint)">${fmtV(max)}</text>
    <line x1="${P}" x2="${W-8}" y1="${H-18}" y2="${H-18}" stroke="var(--grid)"/>
    ${rows.map((r,i)=>{const x=P+i*((W-P-8)/Math.max(n,1));const v=+r[key]||0;
      return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,H-18-y(v))}" rx="2" fill="${color}"><title>${r.date} · ${fmtV(v)}</title></rect>`}).join('')}
    ${rows.length?`<text x="${P}" y="${H-5}" font-size="9" fill="var(--text-faint)">${rows[0].date}</text><text x="${W-8}" y="${H-5}" text-anchor="end" font-size="9" fill="var(--text-faint)">${rows[rows.length-1].date}</text>`:''}</svg>`;
}

// --------------------------------------------------------------- renderers
function renderRequests(d,h){
  const total=d.timeline.reduce((s,r)=>s+ +r.requests,0),errs=d.timeline.reduce((s,r)=>s+ +r.errors,0);
  return `<div class="meta" style="margin:6px 0"><span>requests <b>${fmt(total)}</b></span><span>errors <b>${fmt(errs)}</b></span><span>error rate <b>${total?fmt(100*errs/total,2):'–'}%</b></span><span>window <b>${h} h</b></span></div>
    <div class="grid2">
    <div class="chartbox"><div class="cap">Requests (<span style="color:var(--crit)">■</span> errors) · otel_spans server spans</div>${barLine(d.timeline)}</div>
    <div class="chartbox"><div class="cap">Latency percentiles</div>${latLines(d.timeline)}</div></div>
    <table class="data"><tr><th>route</th><th>requests</th><th>errors</th><th>avg ms</th><th>p95 ms</th></tr>
    ${d.routes.map(r=>`<tr><td class="mono">${esc(r.route)}</td><td>${fmt(r.requests)}</td><td>${+r.errors?`<span style="color:var(--crit)">${fmt(r.errors)}</span>`:'0'}</td><td>${fmt(r.avg_ms)}</td><td>${fmt(r.p95_ms)}</td></tr>`).join('')}</table>`;
}
function renderErrors(d){
  const fr=d.failed_requests,el=d.error_logs,gr=d.groups||[];
  if(!fr.length&&!el.length&&!gr.length)return '<div class="loading">no errors in window 🎉</div>';
  const groups=gr.length?`<div class="cap" style="margin:8px 0 0;font-size:12px;color:var(--text-muted)">Error groups (fingerprinted) · ${gr.length}</div>
    <table class="data"><tr><th>fingerprint</th><th>count</th><th>first seen</th><th>last seen</th><th>sample</th></tr>
    ${gr.map(g=>`<tr><td class="mono">${esc(g.fingerprint)}</td><td><b>${fmt(g.occurrences)}</b></td>
      <td style="white-space:nowrap">${new Date(g.first_seen).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
      <td style="white-space:nowrap">${ago(new Date(g.last_seen).getTime()/1000)}</td>
      <td class="mono" style="font-size:10.5px" title="${esc(g.sample)}">${esc((g.sample||'').slice(0,140))}</td></tr>`).join('')}</table>`:'';
  return `${groups}${fr.length?`<div class="cap" style="margin:8px 0 0;font-size:12px;color:var(--text-muted)">Failed requests · ${fr.length}</div>
    <table class="data"><tr><th>time</th><th>span</th><th>ms</th><th>detail</th><th>trace</th></tr>
    ${fr.map(r=>`<tr class="click" onclick="openTrace('${esc(r.trace_id)}')"><td>${new Date(r.time).toLocaleTimeString()}</td><td class="mono">${esc(r.name)}</td><td>${fmt(r.duration_ms)}</td><td class="mono">${esc((r.message||('HTTP '+(r.http_status||'?'))).slice(0,90))}</td><td class="mono">${esc((r.trace_id||'').slice(0,8))}…</td></tr>`).join('')}</table>`:''}
  ${el.length?`<div class="cap" style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">Error logs · ${el.length}</div>
    <table class="data"><tr><th>time</th><th>sev</th><th>message</th></tr>
    ${el.map(r=>`<tr><td>${new Date(r.time).toLocaleTimeString()}</td><td><span class="chip ${esc(r.severity_text||'ERROR')}">${esc(r.severity_text||'ERR')}</span></td><td class="mono">${esc(String(r.body||'').slice(0,260))}</td></tr>`).join('')}</table>`:''}`;
}
function renderLogs(logs){
  if(!logs.length)return '<div class="loading">no logs in window</div>';
  return `<table class="data"><tr><th>time</th><th>sev</th><th>message</th></tr>
    ${logs.map(r=>`<tr><td style="white-space:nowrap">${new Date(r.time).toLocaleTimeString()}</td><td><span class="chip ${esc(r.severity)}">${esc(r.severity)}</span></td><td class="mono" title="${esc(String(r.body||''))}">${esc(String(r.body||'').slice(0,240))}</td></tr>`).join('')}</table>`;
}
function renderTraces(traces){
  if(!traces.length)return '<div class="loading">no traces in window — traces need the app instrumented with opentelemetry-instrument</div>';
  return `<table class="data"><tr><th>time</th><th>operation</th><th>route</th><th>ms</th><th>status</th></tr>
    ${traces.map(r=>`<tr class="click" onclick="openTrace('${esc(r.trace_id)}')"><td style="white-space:nowrap">${new Date(r.time).toLocaleTimeString()}</td><td class="mono">${esc(r.name)}</td><td class="mono">${esc(r.route)}</td><td>${fmt(r.duration_ms)}</td><td><span class="pill ${r.status==='error'?'down':'ok'}">${r.status.toUpperCase()}</span></td></tr>`).join('')}</table>`;
}
async function openTrace(tid){
  const body=$('#tabBody');body.innerHTML='<div class="loading">loading trace…</div>';
  try{
    const d=await get('api/traces/'+encodeURIComponent(tid));
    if(!d.spans.length){body.innerHTML='<div class="loading">trace not found (may have rotated)</div>';return}
    const t0=Math.min(...d.spans.map(s=>+s.start_time_unix_nano));
    const t1=Math.max(...d.spans.map(s=>+s.end_time_unix_nano));
    const span=s=>{const l=100*(+s.start_time_unix_nano-t0)/(t1-t0||1),w=Math.max(0.5,100*(+s.end_time_unix_nano-+s.start_time_unix_nano)/(t1-t0||1));
      return `<div class="row"><div class="nm" style="padding-left:${depthOf(s,d.spans)*12}px" title="${esc(s.name)}">${esc(s.name)}</div>
        <div class="track"><div class="bar ${s.status==='error'?'error':''}" style="left:${l}%;width:${w}%;${s.status==='error'?'background:var(--crit)':''}"></div></div>
        <div class="dur">${fmt((+s.end_time_unix_nano-+s.start_time_unix_nano)/1e6,1)} ms</div></div>`;};
    body.innerHTML=`<button class="back" onclick="loadTab('traces')">← back to traces</button>
      <div style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">trace ${esc(tid)} · ${d.spans.length} spans · ${fmt((t1-t0)/1e6,1)} ms</div>
      <div class="wf">${d.spans.map(span).join('')}</div>
      ${d.logs.length?`<div class="cap" style="margin:12px 0 0;font-size:12px;color:var(--text-muted)">Correlated logs</div>${renderLogs(d.logs)}`:''}`;
  }catch(e){body.innerHTML=`<div class="errbox">${esc(e.message)}</div>`;}
}
function depthOf(s,all){let d=0,cur=s,seen=0;const byId={};all.forEach(x=>byId[x.span_id]=x);
  while(cur&&cur.parent_span_id&&byId[cur.parent_span_id]&&seen++<20){d++;cur=byId[cur.parent_span_id];}return d;}

function renderAgentList(d){
  if(!d.experiment)return '<div class="loading">no MLflow experiment bound to this app — bind an <code>experiment</code> resource and log traces (docs/INSTRUMENTATION.md L3) to light this up</div>';
  if(!d.traces.length)return '<div class="loading">experiment bound, no agent traces yet — traffic every ~5 min generates them</div>';
  return `<div style="font-size:11.5px;color:var(--text-muted);margin:8px 0">MLflow experiment ${esc(d.experiment)} · newest first · click a trace for the unified OTel + agent view</div>
    <table class="data"><tr><th>time</th><th>agent</th><th>state</th><th>ms</th><th>request</th><th>req id</th></tr>
    ${d.traces.map(t=>`<tr class="click" onclick="openAgentTrace('${esc(t.trace_id)}')">
      <td style="white-space:nowrap">${t.request_time?new Date(t.request_time).toLocaleTimeString():'–'}</td>
      <td>${esc(t.tags.agent||'–')}</td>
      <td><span class="pill ${/OK/i.test(t.state)?'ok':'down'}">${esc(t.state||'?')}</span></td>
      <td>${fmt(t.duration_ms)}</td>
      <td class="mono" style="font-size:10.5px" title="${esc(t.response_preview)}">${esc(t.preview)}</td>
      <td class="mono">${esc((t.client_request_id||'').slice(0,8))}</td></tr>`).join('')}</table>`;
}
const TYPE_COLOR={LLM:'var(--brand)',CHAT_MODEL:'var(--brand)',TOOL:'var(--teal)',AGENT:'var(--purple)',RETRIEVER:'var(--warn)'};
async function openAgentTrace(tid){
  const body=$('#tabBody');body.innerHTML='<div class="loading">assembling unified trace…</div>';
  try{
    const d=await get(`api/apps/${encodeURIComponent(CUR)}/agent-traces/${encodeURIComponent(tid)}`);
    const all=(d.otel_spans||[]).filter(s=>+s.start_time_unix_nano>0).sort((a,b)=>a.start_time_unix_nano-b.start_time_unix_nano);
    if(!all.length){body.innerHTML='<div class="loading">no correlated OTel spans (yet) — Zerobus delivery can lag ~a minute behind MLflow</div>';return}
    const t0=Math.min(...all.map(s=>+s.start_time_unix_nano)),t1=Math.max(...all.map(s=>+s.end_time_unix_nano));
    const services=[...new Set(all.map(s=>s.service_name))];
    const row=s=>{
      const l=100*(+s.start_time_unix_nano-t0)/(t1-t0||1),w=Math.max(.5,100*(+s.end_time_unix_nano-+s.start_time_unix_nano)/(t1-t0||1));
      const agent=!!s.span_type;
      const color=s.status==='error'?'var(--crit)':agent?(TYPE_COLOR[s.span_type]||'var(--purple)'):'var(--info)';
      const chip=agent?`<span class="chip INFO" style="background:var(--purple-bg);color:var(--purple)">${esc(s.span_type)}</span>`
                      :`<span class="chip INFO">${esc((s.service_name||'otel').replace('monitor-demo-',''))}</span>`;
      const tok=(+s.in_tokens||+s.out_tokens)?` · ${fmt(s.in_tokens)}→${fmt(s.out_tokens)} tok`:'';
      return `<div class="row"><div class="nm" style="padding-left:${depthOf(s,all)*12}px" title="${esc(s.name)}${esc(tok)}">${chip} ${esc(s.name)}</div>
        <div class="track"><div class="bar" style="left:${l}%;width:${w}%;background:${color}"></div></div>
        <div class="dur">${fmt((+s.end_time_unix_nano-+s.start_time_unix_nano)/1e6,1)} ms</div></div>`;};
    body.innerHTML=`<button class="back" onclick="loadTab('traces')">← back to traces</button>
      <div style="font-size:12px;margin:4px 0"><b>Unified trace</b> — MLflow <code>${esc(tid.slice(0,18))}…</code> ⟷ OTel, joined on trace ids + <code>client_request_id=${esc((d.client_request_id||'?').slice(0,12))}</code>
        ${d.mlflow_url?` · <a href="${esc(d.mlflow_url)}" target="_blank">open in MLflow ↗</a>`:''}</div>
      <div class="legend"><span><i style="background:var(--info)"></i>app spans${services.length>1?' · '+services.length+' services':''}</span>
        <span><i style="background:var(--brand)"></i>LLM</span><span><i style="background:var(--teal)"></i>TOOL</span>
        <span><i style="background:var(--purple)"></i>AGENT</span><span><i style="background:var(--crit)"></i>error</span></div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--text-faint)">${all.length} spans · ${fmt((t1-t0)/1e6,1)} ms · ${esc(d.mlflow.info.state)} · services: ${esc(services.join(', ')||CUR)} · "${esc(d.mlflow.info.preview)}"</div>
      <div class="wf">${all.map(row).join('')}</div>
      ${d.logs.length?`<div class="cap" style="margin:12px 0 0;font-size:12px;color:var(--text-muted)">Correlated logs (same OTel trace)</div>${renderLogs(d.logs)}`:''}`;
  }catch(e){body.innerHTML=`<div class="errbox">${esc(e.message)}</div>`;}
}

function scoreColor(s){return s>=80?'var(--ok)':s>=60?'var(--warn)':'var(--crit)'}
const BEHIND_RANK={major:0,minor:1,patch:2,unpinned:3,unknown:4,unchecked:5,current:6};
function depBadge(b){
  const cls=b==='major'?'ERROR':b==='minor'?'WARN':b==='current'||b==='patch'?'INFO':'UNKNOWN';
  const label=b==='current'?'up to date':b==='patch'?'patch behind':b==='minor'?'minor behind':b==='major'?'MAJOR behind':b;
  return `<span class="chip ${cls}">${label}</span>`;
}
function depTable(depsJson){
  let deps=[];try{deps=JSON.parse(depsJson||'[]')}catch(e){}
  if(!deps.length||deps[0].behind===undefined)return '';  // pre-report scans: no table
  deps.sort((a,b)=>(b.vulns?.length||0)-(a.vulns?.length||0)||BEHIND_RANK[a.behind]-BEHIND_RANK[b.behind]||a.name.localeCompare(b.name));
  const shown=deps.slice(0,60);
  return `<div class="cap" style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">Packages · ${deps.length}
      (${deps.filter(x=>x.eco==='npm').length} npm) · installed vs latest, CVEs from OSV.dev</div>
    <table class="data"><tr><th>package</th><th>installed</th><th>latest</th><th>freshness</th><th>vulnerabilities</th></tr>
    ${shown.map(x=>`<tr>
      <td><b>${esc(x.name)}</b> <span class="chip INFO" style="background:var(--grid);color:var(--text-muted)">${esc(x.eco)}</span></td>
      <td class="mono">${esc(x.version||'unpinned')}</td><td class="mono">${esc(x.latest||'–')}</td>
      <td>${depBadge(x.behind)}</td>
      <td>${x.vulns&&x.vulns.length?`<span class="chip ERROR">${x.vulns.length}</span> <span class="mono" style="font-size:10.5px">${x.vulns.map(esc).join(' ')}</span>`:'<span style="color:var(--text-faint)">none known</span>'}</td>
    </tr>`).join('')}</table>
    ${deps.length>shown.length?`<div style="font-size:11.5px;color:var(--text-faint);margin-top:4px">…and ${deps.length-shown.length} more</div>`:''}`;
}
function renderSecurity(d){
  if(!d.scan)return '<div class="loading">not scanned yet — the hourly monitor-inventory-scan job scans each new deployment (or hit Sync fleet)</div>';
  const s=d.scan,score=+s.quality_score;
  const sevs=['critical','high','medium','low'].map(k=>`<span class="chip ${k==='critical'||k==='high'?'ERROR':k==='medium'?'WARN':'INFO'}">${k} ${s['findings_'+k]}</span>`).join(' ');
  return `<div style="display:flex;align-items:center;gap:16px;margin:10px 0">
      <div style="font-size:40px;font-weight:700;color:${scoreColor(score)}">${score}</div>
      <div><div style="font-weight:600">quality score</div>
      <div style="font-size:12px;color:var(--text-muted)">scanned ${new Date(s.scanned_at).toLocaleString()} · deployment ${esc((s.deployment_id||'').slice(0,8))}…</div>
      <div style="margin-top:4px">${sevs}</div></div></div>
    <div class="meta" style="margin:8px 0 4px"><span>files <b>${s.files}</b></span><span>py loc <b>${fmt(s.py_loc)}</b></span>
      <span>deps <b>${s.deps}</b> (${s.deps_pinned} pinned)</span>
      <span>freshness <b>${s.freshness_score!=null?s.freshness_score+'/100':'–'}</b></span>

function genaiHealth(d){
  const tax=(d.error_taxonomy||[]),steps=(d.agent_steps||[]),qual=(d.quality||[]),fb=(d.feedback||[]);
  let html='';
  if(qual.length){const q=qual[0];
    const sc=(v,inv)=>{const n=+v;const good=inv?n<=3:n>=7;const bad=inv?n>3:n<6;
      return `<b style="color:${bad?'var(--crit)':good?'var(--ok)':'var(--warn)'}">${fmt(n,1)}</b>`};
    html+=`<div class="cap" style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">Runtime quality — LLM judge over sampled production traces (daily)</div>
    <div class="meta" style="margin:6px 0"><span>relevance ${sc(q.relevance)}/10</span><span>faithfulness ${sc(q.faithfulness)}/10</span>
      <span>toxicity ${sc(q.toxicity,true)}/10</span><span>${fmt(q.traces_sampled)} traces · ${new Date(q.ts).toLocaleString([],{month:'short',day:'numeric'})}</span></div>
    ${q.comment?`<div style="font-size:12px;color:var(--text-muted)">“${esc(q.comment)}”</div>`:''}`;}
  if(fb.length){const tot=fb.reduce((s,r)=>s+ +r.n,0),neg=fb.reduce((s,r)=>s+ +r.negative,0);
    const avg=fb.reduce((s,r)=>s+ +r.avg_rating*+r.n,0)/Math.max(tot,1);
    html+=`<div class="cap" style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">User feedback — in-app ★ ratings via /monitor/feedback · 30 d</div>
    <div class="meta" style="margin:6px 0"><span>avg <b style="color:${avg>=4?'var(--ok)':avg>=3?'var(--warn)':'var(--crit)'}">${fmt(avg,2)}★</b></span>
      <span>ratings <b>${fmt(tot)}</b></span><span>negative (≤2★) <b>${neg?`<span style="color:var(--crit)">${fmt(neg)}</span>`:'0'}</b></span></div>`;}
  if(tax.length)html+=`<div class="cap" style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">LLM error taxonomy · 7 d — rate limits vs policy vs timeouts vs schema</div>
    <table class="data"><tr><th>category</th><th>errors</th><th>last seen</th><th>sample</th></tr>
    ${tax.map(r=>`<tr><td class="mono">${esc(r.category)}</td><td style="color:var(--crit)">${fmt(r.errors)}</td>
      <td style="white-space:nowrap">${new Date(r.last_seen).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>

function complianceRow(a){
  const s=ENRICH.security[a.name],r=ENRICH.reviews[a.name],c=ENRICH.config?ENRICH.config[a.name]:null;
  const t=tagsOf(a.name);
  const checks=[
    ['telemetry',GOV&&GOV.telemetry_active.includes(a.name)],
    ['scan ≥60',s&&+s.quality_score>=60],
    ['no crit/high',s&&(+s.findings_critical+ +s.findings_high)===0],
    ['review ok',r&&r.verdict!=='reject'],
    ['tagged',!!(t.team&&t.cost_center)],
    ['budget set',c&&+c.budget_usd_month>0],

  const passed=checks.filter(c=>c[1]).length;
  return {name:a.name,checks,passed,total:checks.length};
}

// Product blocks keep their own error states so an unavailable job does not hide other evidence.
function productTable(rows,columns){
  if(!rows?.length)return '<div class="loading">No observations yet.</div>';
  return `<div style="overflow:auto"><table class="data"><tr>${columns.map(([key,label])=>`<th>${esc(label)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${columns.map(([key])=>`<td>${r[key]==null?'–':esc(String(r[key]))}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function productError(d){return d.error?`<div class="errbox">${esc(d.error)}</div>`:''}
function dollars(v){return v==null?'–':'$'+fmt(v,4)}
function renderEconomics(d){
  if(d.error)return productError(d);

    ${productTable(rows.map(r=>({...r,total_usd:dollars(r.total_usd),usd_per_1k_requests:dollars(r.usd_per_1k_requests),usd_per_session:dollars(r.usd_per_session),usd_per_user:dollars(r.usd_per_user),usd_per_outcome:dollars(r.usd_per_outcome)})),[['name','App'],['total_usd','Total estimate'],['usd_per_1k_requests','$/1k requests'],['usd_per_session','$/session'],['usd_per_user','$/user'],['usd_per_outcome','$/outcome'],['completions','Outcomes'],['unpriced_days','Unpriced days']])}</section>`;
}

async function productPut(path,body){

// tooltip layer: any [data-tip] element gets a rich hover bubble
const tipEl=document.createElement('div');tipEl.id='tip';document.body.appendChild(tipEl);
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]');
  if(!t||!t.dataset.tip){tipEl.style.display='none';return}
  tipEl.innerHTML=t.dataset.tip;
  tipEl.style.display='block';
  const r=t.getBoundingClientRect(),tw=tipEl.offsetWidth,th=tipEl.offsetHeight;
  let left=Math.min(Math.max(8,r.left),window.innerWidth-tw-8);
  let top=r.bottom+8; if(top+th>window.innerHeight-8) top=r.top-th-8;
  tipEl.style.left=left+'px'; tipEl.style.top=top+'px';
});

<script>

      catch(err){el.querySelector('.opsMessage').textContent=err.message}
    });
  }catch(e){if(el.isConnected)el.textContent='SLOs unavailable: '+e.message}
}
</script>

<script>
async function loadTelemetryHealth(name){
  const el=document.getElementById('telemetryHealth');if(!el)return;
  try{
    const d=await get('api/apps/'+encodeURIComponent(name)+'/telemetry-health');if(!el.isConnected||CUR!==name)return;
    const h=d.health;if(!h){el.textContent='Data quality: unknown (no telemetry-health snapshot)';return}
    const pct=n=>n==null?'unknown':(Number(n)*100).toFixed(1)+'%';
    el.innerHTML=`<div class="cap">Data quality <span class="badge">${esc(h.quality)}</span></div>
      <div class="meta">Envelope coverage ${pct(h.envelope_coverage)} · suspected orphans ${pct(h.orphan_ratio_24h)} (24h) · sampler ratio ${h.sampler_ratio==null?'unknown':esc(h.sampler_ratio)}</div>
      <div class="meta">Last span ${esc(h.last_span_at||'unknown')} · log ${esc(h.last_log_at||'unknown')} · metric ${esc(h.last_metric_at||'unknown')}</div>
      <div class="meta">HTTP semconv: legacy only ${pct(h.semconv_legacy_only)} · stable only ${pct(h.semconv_stable_only)} · both ${pct(h.semconv_both)}</div>
      <div class="meta">Gateway − OTel tokens: ${h.gateway_vs_otel_tokens==null?'unknown':fmt(h.gateway_vs_otel_tokens)} · ${esc(h.token_date||'no reconciled day')}</div>
      <p>Sampling and late data can look like broken propagation. Orphan alerts require &gt;20% continuously for six hours.</p>`;
  }catch(e){if(el.isConnected)el.textContent='Data quality unavailable: '+e.message}
}
</script>

<script>
async function loadMonitorCost(){
  const el=document.getElementById('monitorCost');if(!el)return;
  try{
    const d=await get('api/monitor/cost');if(!el.isConnected)return;
    const latest=(d.daily||[]).reduce((v,r)=>r.date>v?r.date:v,''),rows=(d.daily||[]).filter(r=>r.date===latest);
    const known=rows.reduce((s,r)=>s+(r.usd==null?0:+r.usd),0),partial=rows.some(r=>r.usd==null);
    const storage=(d.storage||[]).reduce((s,r)=>s+(r.size_bytes==null?0:+r.size_bytes),0);
    el.innerHTML=`<h2>Cost of monitoring</h2><div class="meta">${latest?`$${fmt(known,2)} ${partial?'known subtotal':'total'} · ${esc(latest)}`:'No cost data yet'} · ${(storage/1024**3).toFixed(3)} GiB observed Delta storage${(d.storage||[]).some(r=>r.size_bytes==null)?' (partial)':''}</div>
      <table class="data"><tr><th>Component</th><th>USD</th><th>Input / output tokens</th><th>Basis</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.component)}</td><td>${r.usd==null?'unknown':'$'+fmt(r.usd,2)}</td><td>${r.input_tokens==null?'—':fmt(r.input_tokens)} / ${r.output_tokens==null?'—':fmt(r.output_tokens)}</td><td>${esc(r.basis)}</td></tr>`).join('')}</table>
      <p>Billing lags. Warehouse cost is a duration-share estimate; token USD requires model prices. Unknown components are excluded from the known subtotal.</p>`;
  }catch(e){if(el.isConnected)el.textContent='Monitor cost unavailable: '+e.message}
}
</script>
